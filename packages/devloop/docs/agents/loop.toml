# Issue-to-PR loop configuration for THIS repo (funloops).
#
# Read by the `devloop` rail (`uv run devloop config`) and the /issue-loop
# command (orchestration). A new host
# repo starts from `loop.toml.template` beside this file, which carries the
# same knobs with their defaults commented and nothing host-specific in them.
#
# Per-run posture belongs on the command line, not in edits to this file:
# `--set` and its sugar are issue-loop.command.md §0's.

[loop]
max_issues_per_run = 3   # token guardrail: issues processed per invocation
max_fix_rounds = 2       # implement→gates→fix iterations before routing to human; the orchestrator never extends it
training_mode = true     # pause for human approval before push/PR; flip when trusted
branch_prefix = "loop/issue-"
require_green_baseline = true   # red suite on main → refuse to implement (fix the baseline issue first)
run_mode = "pass"          # pass | exhaust (issue-loop.command.md §0)
delivery = "pr-per-issue"  # pr-per-issue | stacked (issue-loop.command.md §0)

[tdd]
# auto: TDD is ENFORCED in implementer standing orders iff the per-run
#       baseline probe (tests gate on the pristine worktree) is green.
# always / never: override the probe.
mode = "auto"

[labels]
runnable = "ready-for-agent"
claimed = "agent-claimed"
on_gate_failure = "ready-for-human"

# ── Risk-lane triage (devloop triage) ─────────────────────────────────────
# After all gates pass, the orchestrator assembles the shipped PR's signal set
# and runs `triage --signals-json` to classify it into a lane — yellow
# (review-light) or red (ready-for-human) — so a human reviews only what
# matters. The rail only CLASSIFIES; the orchestrator applies the label. red
# reuses the on_gate_failure label `ready-for-human` deliberately (same
# "human, please look" rung). Red wins; every triggered rule is reported.
[triage]
# Sensitive paths → always red, regardless of size/first-try/findings. Three
# pattern forms: dir prefix (trailing '/'), bare basename (matches at any
# depth), glob (*/?/[ — matched against the basename). funloops' layout: the
# CLI module (the workspace's one external interface per the boundary spec),
# the gate pipeline itself (a trust boundary), and the packaging wiring that
# decides what a member ships. Bare basenames so they hold for every member
# package, not just devloop.
sensitive_paths = [
    "cli.py",
    "loop.toml",
    "pyproject.toml",
]
# Watched paths → yellow with the path named (skim, never gate). The judgment
# plane: doc changes steer every future run, so a human glances even when
# gates are green. Glob form, not a dir prefix, so a second workspace member's
# judgment plane lands in the same lane the day it appears; the dir prefix
# is the repo-root overlay (docs/agents/constitution.md), which the glob's
# leading `*/` cannot reach.
watched_paths = ["*/docs/agents/*", "docs/agents/"]
red_diff_lines = 800           # "big diff" → red (a human-lane signal, never a block)

# ── Dispatch ──────────────────────────────────────────────────────────────
# Which agent runs each role. A role IS its entry: implementer and judge
# always resolve, and one more table here declares one more role
# (`devloop pack --role <r>` takes any of them). Every key takes --set for
# one run; the template lists them all. Absent keys mean the Agent
# tool in the orchestrator's own session and model, with no argv tail.
[dispatch.implementer]
posture = "writer"          # writer: persona + standing orders; reader: neither
transport = "agent-tool"    # agent-tool | herdr

[dispatch.judge]
# reader: the per-slice judge, its pack the touched modules in full.
# shape: the stack-tip pass over every touched module and its edges
# (`devloop pack <N...> --role judge --posture shape`).
posture = ["reader", "shape"]
transport = "agent-tool"

# ── Gate pipeline ─────────────────────────────────────────────────────────
# Ordered. kinds: command | diff (deterministic, run by the rail)
#                 judge (LLM-judged, run by the command in a fresh
#                 subagent context). `devloop check --issue <N>` runs every
# command gate, then the issue's `verify:` lines, as one result list. Adding another
# command/diff gate is config-only; a new *kind* needs a DETERMINISTIC entry
# in devloop/gates.py (deterministic kinds) or a section in the /issue-loop
# command (orchestrated kinds). A gate entry may carry only the keys its kind
# reads (devloop/gates.py GATE_KEYS); anything else is refused by name.

[[gates]]
id = "diff-guard"
kind = "diff"
required = true
# same three pattern forms as [triage].sensitive_paths above (both go
# through devloop/paths.py). A forbidden-paths check only: no line cap.
forbidden_paths = [".github/workflows/", "dist/"]

[[gates]]
id = "tests"
kind = "command"
required = true
cmd = "uv run pytest -x -q"
timeout_sec = 1200

# The one judgment stage: a fresh judge returns criteria[] verdicts against
# the issue's acceptance criteria plus advisory findings[]. Fails iff a
# criterion is not-met; findings never block.
[[gates]]
id = "judge"
kind = "judge"
required = true
